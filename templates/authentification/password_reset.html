{% extends 'core/base.html' %}
{% block content %}
<section class="py-5">
    <div class="container">
        <div class="col-lg-5 mx-auto">
            <div class="card border-0 shadow-sm p-4">
                <h2 class="text-success text-center mb-3">Mot de passe oublié</h2>
                <p class="text-muted text-center">Entrez votre email, nous vous enverrons un lien de réinitialisation.</p>
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-success w-100">Envoyer le lien</button>
                </form>
            </div>
        </div>
    </div>
</section>
{% endblock %}
