{% extends 'core/base.html' %}
{% block content %}
<section class="py-5">
    <div class="container">
        <div class="col-lg-5 mx-auto">
            <div class="card border-0 shadow-sm p-4">
                <h2 class="text-success text-center mb-3">Nouveau mot de passe</h2>
                {% if validlink %}
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-success w-100">Réinitialiser</button>
                </form>
                {% else %}
                <p class="text-danger text-center">Ce lien n'est plus valide.</p>
                {% endif %}
            </div>
        </div>
    </div>
</section>
{% endblock %}
