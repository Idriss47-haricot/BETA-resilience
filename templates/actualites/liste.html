<form method="get" action="{% url 'actualites:recherche' %}" class="mb-4">
    <div class="input-group">
        <input type="text" name="q" class="form-control" placeholder="Rechercher un article..." value="{{ recherche|default:'' }}">
        <button class="btn btn-success" type="submit"><i class="fas fa-search"></i></button>
    </div>
</form>

{% if is_paginated %}
<nav aria-label="Pagination" class="mt-5">
    <ul class="pagination justify-content-center">
        {% if page_obj.has_previous %}
        <li class="page-item"><a class="page-link" href="?page={{ page_obj.previous_page_number }}">Précédent</a></li>
        {% endif %}
        {% for num in page_obj.paginator.page_range %}
        <li class="page-item {% if page_obj.number == num %}active{% endif %}">
            <a class="page-link" href="?page={{ num }}">{{ num }}</a>
        </li>
        {% endfor %}
        {% if page_obj.has_next %}
        <li class="page-item"><a class="page-link" href="?page={{ page_obj.next_page_number }}">Suivant</a></li>
        {% endif %}
    </ul>
</nav>
{% endif %}
